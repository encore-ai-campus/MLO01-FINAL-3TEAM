services:
  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
  classify:
    environment: &test-models
      VOC_CLASSIFIER_STABLE_URL: http://fixture:8080/stable
      VOC_CLASSIFIER_CANARY_URL: http://fixture:8080/canary
      VOC_CLASSIFIER_ROUTER_URL: ""
      VOC_CANARY_PERCENT: "50"
      VOC_EMBEDDING_URL: http://fixture:8080/embedding
      VOC_MODEL_API_TOKEN: ""
    depends_on:
      fixture: {condition: service_healthy}
  embed:
    environment: *test-models
    depends_on:
      fixture: {condition: service_healthy}
  metrics:
    environment: *test-models
  ticket-desk:
    environment:
      VOC_REPLY_URL: http://fixture:8080/reply
      VOC_REPLY_TOKEN: ""
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    secrets: [test_staff_password]
    depends_on:
      fixture: {condition: service_healthy}
  fixture:
    image: encore-voc-collector:local
    build: {context: ./src, dockerfile: collector/Dockerfile}
    entrypoint: ["python", "/opt/voc-test-fixture.py"]
    command: ["serve"]
    environment:
      <<: *test-models
      TZ: UTC
      PYTHONPATH: /app/src
    volumes:
      - ./monitoring/test-fixture.py:/opt/voc-test-fixture.py:ro
      - ${VOC_CAPTURE_DIR:?Set the test capture directory}:/data
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15

secrets:
  test_staff_password: {file: "${VOC_MONITOR_SECRETS_DIR:?Set the test secrets directory}/staff-password"}
