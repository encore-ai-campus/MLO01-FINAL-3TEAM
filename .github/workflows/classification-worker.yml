name: Classification worker
on:
  workflow_call:
  pull_request:
    branches-ignore: [develop]
    paths:
      - ".github/workflows/classification-worker.yml"
      - "src/workers/classification/**"
      - "src/collector/*.sql"
      - "src/contracts/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Test worker and build image
        env:
          VOC_CLASSIFICATION_TEST_ADMIN_DSN: postgresql://postgres:fixture@localhost:5432/postgres
        run: |
          python -m pip install -r src/workers/classification/requirements.txt
          python -m unittest discover -s src/workers/classification -p 'test_*.py' -v
          docker build -t voc-classification-worker:verify src/workers/classification
