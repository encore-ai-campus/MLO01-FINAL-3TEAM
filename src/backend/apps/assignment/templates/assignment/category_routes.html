{% extends "preferences/base.html" %}
{% block title %}카테고리별 담당 부서{% endblock %}
{% block settings_content %}
<div class="desk-heading">
  <h1>카테고리별 담당 부서</h1>
  <a class="desk-button" href="{% url 'assignment:index' %}">자동 배정 설정</a>
</div>
<section class="desk-card settings-table-wrap">
  <table class="desk-table">
    <thead><tr><th scope="col">카테고리</th><th scope="col">담당 부서</th></tr></thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <th scope="row">{{ category.name }}</th>
        <td>
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="category_uuid" value="{{ category.category_uuid }}">
            <label for="team-{{ forloop.counter }}">담당 부서</label>
            <select id="team-{{ forloop.counter }}" name="team_uuid">
              <option value="">미배정</option>
              {% for team in teams %}<option value="{{ team.team_uuid }}"{% if team.team_uuid == category.team_uuid %} selected{% endif %}>{{ team.name }}</option>{% endfor %}
            </select>
            <button class="desk-button" type="submit">저장</button>
          </form>
        </td>
      </tr>
      {% empty %}<tr><td colspan="2">회사 도메인에 등록된 카테고리가 없습니다.</td></tr>{% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
