<details class="ticket-conversation ticket-actions">
  <summary>이관 및 검토 요청</summary>
  <details>
    <summary>티켓 이관</summary>
    {% if not is_assignee %}
      <p>현재 담당 상담사만 이관을 요청할 수 있습니다.</p>
    {% elif transfer_recipients %}
    <form method="post" action="{% url 'tickets:transfer' ticket.ticket_uuid %}{% querystring %}">
      {% csrf_token %}
      <label>새 담당자 <select name="recipient_uuid" required><option value="">선택</option>
        {% for recipient in transfer_recipients %}<option value="{{ recipient.staff_user_uuid }}">{{ recipient.name }}{% if recipient.team %} · {{ recipient.team }}{% endif %}</option>{% endfor %}
      </select></label>
      <label>이관 사유 <textarea name="reason" required></textarea></label>
      <label>첨부 답변 <textarea name="attached_reply"></textarea></label>
      <button class="desk-button desk-button-solid">이관 요청</button>
    </form>
    {% else %}<p>선택할 수 있는 상담사가 없습니다.</p>{% endif %}
  </details>
  <details>
    <summary>검토 요청</summary>
    {% if review_channels %}
    <form method="post" enctype="multipart/form-data" action="{% url 'tickets:review-requests' ticket.ticket_uuid %}{% querystring %}">
      {% csrf_token %}
      <label>공유 채널 <select name="review_channel_uuid" required><option value="">선택</option>
        {% for channel in review_channels %}<option value="{{ channel.review_channel_uuid }}">{{ channel.name }}</option>{% endfor %}
      </select></label>
      <label>상세 메모 <textarea name="memo" required></textarea></label>
      <label>참고 텍스트 <textarea name="reference_text"></textarea></label>
      <label>참고 이미지 <input type="file" name="reference_image" accept="image/png,image/jpeg,image/gif,image/webp"></label>
      <button class="desk-button desk-button-solid">검토 요청</button>
    </form>
    {% else %}<p>선택할 수 있는 공유 채널이 없습니다.</p>{% endif %}
  </details>
</details>
