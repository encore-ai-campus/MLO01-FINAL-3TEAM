<section class="ticket-actions detail-compose-area" aria-label="{% if is_assignee and not delivery_uncertain %}고객에게 답변 및 내부 메모 작성{% else %}내부 메모 작성{% endif %}">
  <div class="detail-grip" tabindex="0" role="separator" aria-label="답변 작성 높이" aria-orientation="horizontal"><span></span></div>
  {% if delivery_uncertain %}<p class="detail-delivery-notice" role="status">전송 결과 확인 필요 · 확인 전에는 내부 메모를 작성할 수 있습니다.</p>{% endif %}
  <form class="detail-composer" method="post" action="{% url 'tickets:messages' ticket.ticket_uuid %}{% querystring %}">
    {% csrf_token %}
    <input type="hidden" name="request_key" value="{{ request_key }}">
    {% if is_assignee and not delivery_uncertain %}
      <input type="hidden" name="message_type" value="reply">
    {% else %}
      <input type="hidden" name="message_type" value="memo">
    {% endif %}
    <textarea id="ticket-reply-body" name="body" required rows="4" maxlength="2000"
      aria-label="{% if is_assignee and not delivery_uncertain %}메시지 내용{% else %}내부 메모 내용{% endif %}" placeholder="메시지를 입력하세요...">{% if is_assignee and not delivery_uncertain %}{{ retry_draft }}{% endif %}</textarea>
    <div class="detail-commit">
      <div class="detail-compose-tools">
        {% if is_assignee and quick_replies %}<label>신속답변
          <select id="ticket-quick-reply"><option value="">등록 답변 선택</option>
            {% for reply in quick_replies %}<option value="{{ reply.body }}">{{ reply.name }}</option>{% endfor %}
          </select></label>
        {% endif %}
      </div>
      <div class="detail-compose-buttons">
        {% if is_assignee and not delivery_uncertain %}<button type="button" id="detail-memo-toggle" class="desk-button" aria-pressed="false">내부 메모</button>{% else %}<span class="detail-caption">내부 메모</span>{% endif %}
        <button class="desk-button desk-button-solid" type="submit" data-send-label{% if is_assignee and retry_draft %} data-retry{% endif %}>{% if is_assignee and retry_draft %}다시 보내기{% else %}전송{% endif %}</button>
      </div>
    </div>
  </form>
</section>
