<section class="ticket-conversation ticket-actions" aria-labelledby="ticket-action-title">
  <h2 id="ticket-action-title">답변 작성</h2>
  <form method="post" action="{% url 'tickets:messages' ticket.ticket_uuid %}{% querystring %}">
    {% csrf_token %}
    <input type="hidden" name="request_key" value="{{ request_key }}">
    <label>작성 유형
      <select name="message_type"><option value="reply">고객에게 답변</option><option value="memo">내부 메모</option></select>
    </label>
    {% if quick_replies %}<label>신속답변
      <select id="ticket-quick-reply"><option value="">등록 답변 선택</option>
        {% for reply in quick_replies %}<option value="{{ reply.body }}">{{ reply.name }}</option>{% endfor %}
      </select>
    </label>{% endif %}
    <label for="ticket-reply-body">본문</label>
    <textarea id="ticket-reply-body" name="body" required rows="5"></textarea>
    <button class="desk-button desk-button-solid">저장 또는 전송</button>
  </form>
</section>
