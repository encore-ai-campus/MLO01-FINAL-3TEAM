{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 섭명뭐</title>
  <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
  <script src="{% static 'shared/legacy.js' %}" defer></script>
  <script src="{% static 'accounts/login.js' %}" defer></script>
</head>
<body class="login-page">
  <main id="login-screen" class="screen">
    <section class="login-card" aria-labelledby="login-title">
      <img class="brand" src="{% static 'shared/ticats-logo.png' %}" alt="TiCats" width="144" height="48">
      <h1 id="login-title">로그인</h1>
      <p class="intro">회사 이메일과 비밀번호를 입력해 주세요.</p>
      <form id="login-form" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="email">회사 이메일</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="254" value="{{ email|default:'' }}"
                 {% if error_code == 'INVALID_EMAIL' or error_code == 'INVALID_CREDENTIALS' %}aria-invalid="true"{% endif %}
                 placeholder="name@company.com" aria-describedby="auth-message" required>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <div class="password">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   {% if error_code == 'PASSWORD_REQUIRED' or error_code == 'INVALID_CREDENTIALS' %}aria-invalid="true"{% endif %}
                   placeholder="비밀번호를 입력해 주세요" aria-describedby="auth-message" required>
            <button id="visibility" type="button" class="text-button visibility" aria-label="비밀번호 표시"
                    aria-controls="password" aria-pressed="false">표시</button>
          </div>
        </div>
        <p id="auth-message" class="message auth-message" role="alert">{{ error|default:'' }}</p>
        <button id="submit" class="primary-button" type="submit">로그인</button>
      </form>
      <button type="button" id="open-help" class="text-button help-button" aria-haspopup="dialog">비밀번호를 잊으셨나요?</button>
    </section>
  </main>
  <dialog id="password-help" class="help-dialog" aria-labelledby="help-title" aria-describedby="help-description">
    <h2 id="help-title">비밀번호 분실 안내</h2>
    <div id="help-description">
      <p>사내 관리자에게 비밀번호 초기화를 요청해 주세요. 요청할 때 회사 이메일을 함께 알려주면 관리자가 계정을 확인할 수 있습니다.</p>
      <p>관리자가 비밀번호를 초기화하면 전달받은 비밀번호로 로그인해 주세요.</p>
    </div>
    <form method="dialog"><button class="primary-button" autofocus>확인</button></form>
  </dialog>
</body>
</html>
