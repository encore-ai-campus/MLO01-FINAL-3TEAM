{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}업무 홈{% endblock %} | 섭명뭐</title>
  <link rel="stylesheet" href="{% static 'shared/desk.css' %}">
  {% block styles %}{% endblock %}
  <script defer src="{% static 'shared/legacy.js' %}"></script>
</head>
<body>
  {% include "includes/icons.html" %}
  <div id="desk" class="desk">
    {% include "includes/header.html" %}
    {% include "includes/sidebar.html" %}
    <main class="desk-content" id="main-content">{% block content %}{% endblock %}</main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
