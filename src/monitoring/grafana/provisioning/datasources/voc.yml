apiVersion: 1
datasources:
  - name: 문의 처리 기록
    uid: voc-postgres
    type: grafana-postgresql-datasource
    url: $VOC_MONITOR_DB_HOST
    user: voc_monitor_reader
    secureJsonData:
      password: $MONITOR_READER_PASSWORD
    jsonData:
      database: $VOC_MONITOR_DB_NAME
      postgresVersion: 1600
      sslmode: disable
      maxOpenConns: 4
      maxIdleConns: 2
    isDefault: true
    editable: false
  - name: 서비스 지표
    uid: voc-prometheus
    type: prometheus
    url: http://prometheus:9090
    editable: false
