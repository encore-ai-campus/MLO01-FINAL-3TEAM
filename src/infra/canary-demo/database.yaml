apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canary-demo-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-demo-db
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: canary-demo-db}
  template:
    metadata:
      labels: {app: canary-demo-db}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: voc_canary_demo}
            - {name: POSTGRES_USER, value: voc_demo}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: voc-classification-db, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -U, voc_demo, -d, voc_canary_demo]}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: canary-demo-db}
---
apiVersion: v1
kind: Service
metadata:
  name: canary-demo-db
spec:
  selector: {app: canary-demo-db}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
