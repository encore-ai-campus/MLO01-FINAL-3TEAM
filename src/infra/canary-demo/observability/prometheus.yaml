apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {app: canary-prometheus}
  template:
    metadata:
      labels: {app: canary-prometheus}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/canary/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports: [{name: http, containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 3
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/canary, readOnly: true}
            - {name: timeseries, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: canary-prometheus-config}
        - {name: timeseries, emptyDir: {sizeLimit: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: canary-prometheus
spec:
  type: ClusterIP
  selector: {app: canary-prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
