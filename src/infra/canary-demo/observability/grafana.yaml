apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app: canary-grafana}
  template:
    metadata:
      labels: {app: canary-grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/canary-dashboards/canary.json}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 3
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 750m, memory: 384Mi}
          volumeMounts:
            - {name: grafana-data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: configuration, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: configuration, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: configuration, mountPath: /etc/canary-dashboards/canary.json, subPath: canary.json, readOnly: true}
      volumes:
        - name: configuration
          configMap: {name: canary-grafana-config}
        - {name: grafana-data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: canary-grafana
spec:
  type: ClusterIP
  selector: {app: canary-grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
