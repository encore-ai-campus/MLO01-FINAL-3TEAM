apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voc-ml
resources: [prometheus.yaml, grafana.yaml]
configMapGenerator:
  - name: canary-prometheus-config
    files: [prometheus.yml]
  - name: canary-grafana-config
    files: [datasources.yaml, dashboards.yaml, canary.json]
